<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#9fc9ea">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/icone-192.png">
  <title>Niveau 0 · La boule et le looping</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #a9cfee; overscroll-behavior: none; }
    body { position: fixed; inset: 0; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
      font-family: "Segoe Print", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", "Comic Neue", cursive; color: #3d3d42; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
    .btn { position: absolute; top: max(10px, env(safe-area-inset-top)); width: 46px; height: 46px; border-radius: 50%;
      border: 2px solid rgba(60,60,66,.55); background: rgba(250,248,240,.85); font: 600 20px/1 sans-serif; color: #3d3d42; cursor: pointer; }
    #retour { left: max(10px, env(safe-area-inset-left)); width: auto; padding: 0 14px; border-radius: 23px; font: 600 15px/1 inherit; font-family: inherit; }
    #zoom { right: max(10px, env(safe-area-inset-right)); }
    #plein { right: calc(max(10px, env(safe-area-inset-right)) + 56px); }
    #musique { right: calc(max(10px, env(safe-area-inset-right)) + 112px); }
    #aide { position: absolute; left: 50%; top: max(12px, env(safe-area-inset-top)); transform: translateX(-50%); padding: 6px 14px;
      border-radius: 14px; background: rgba(250,248,240,.85); font-size: 15px; text-align: center; pointer-events: none; transition: opacity .8s; }
    #aide.cache { opacity: 0; }
    #tourner { position: absolute; inset: 0; display: none; place-items: center; background: #a9cfee; font-size: 20px; text-align: center; padding: 20px; }
    @media (orientation: portrait) and (pointer: coarse) { #tourner { display: grid; } }
  </style>
</head>
<body>
  <canvas id="jeu"></canvas>
  <button id="retour" class="btn" type="button">← Menu</button>
  <button id="musique" class="btn" type="button" title="Musique">♪</button>
  <button id="plein" class="btn" type="button" title="Plein écran">⤢</button>
  <button id="zoom" class="btn" type="button" title="Zoom">🔍</button>
  <div id="aide">Niveau 0 · essai des cinq plans<br><small>Glisse vers la droite pour lancer · touche brève : saut · doigt posé : pousse · 🔍 : suivre la boule</small></div>
  <div id="tourner">Tourne ton téléphone à l'horizontale 🔄</div>
  <script type="module" src="js/niveau0.js"></script>
</body>
</html>
