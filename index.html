<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e6e5e1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Boule">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/icone-192.png">
  <link rel="apple-touch-icon" href="icones/icone-180.png">
  <title>La boule et le looping</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #e6e5e1; overscroll-behavior: none; }
    body { position: fixed; inset: 0; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
      font-family: "Segoe Print", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", "Comic Neue", cursive; color: #3d3d42; }
    #jeu { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
    #consigne {
      position: absolute; left: 50%; top: calc(max(10px, env(safe-area-inset-top)) + 58px); transform: translateX(-50%) rotate(-1.5deg);
      width: min(92vw, 560px); text-align: center; pointer-events: none;
      font-weight: 600; font-size: clamp(15px, 1.6vw + 9px, 24px); line-height: 1.25;
      transition: opacity .8s, transform .8s;
    }
    @media (orientation: landscape) {
      #consigne { top: max(8px, env(safe-area-inset-top)); width: min(56vw, 560px); font-size: clamp(14px, 1.2vw + 8px, 22px); }
    }
    #consigne small { display: block; font-size: .72em; opacity: .75; margin-top: .2em; }
    #consigne.cache { opacity: 0; transform: translateX(-50%) translateY(-20px) rotate(-1.5deg); }
    .rond {
      position: absolute; width: 46px; height: 46px; padding: 0; border-radius: 50%; border: 2px solid rgba(60,60,66,.55);
      background: rgba(236,235,231,.78); color: #3d3d42; cursor: pointer; touch-action: manipulation;
      display: grid; place-items: center;
    }
    .rond svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .rond[hidden] { display: none; }
    #rejouer { right: max(10px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom)); }
    #zoom { right: max(10px, env(safe-area-inset-right)); bottom: calc(max(10px, env(safe-area-inset-bottom)) + 56px); }
    #plein-ecran { right: max(10px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top)); }
    #musique { right: calc(max(10px, env(safe-area-inset-right)) + 56px); top: max(10px, env(safe-area-inset-top)); }
    #musique:not(.muet) .barre { display: none; }
    #zoom:not(.large) .plus { display: none; }
    #plein-ecran .sortir, #plein-ecran.actif .entrer { display: none; }
    #plein-ecran.actif .sortir { display: inline; }
    #astuce {
      position: absolute; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%) rotate(.8deg);
      width: min(86vw, 420px); padding: 12px 16px; border: 2px solid rgba(60,60,66,.5); border-radius: 14px 18px 12px 20px;
      background: rgba(240,239,235,.96); font-size: 16px; line-height: 1.35; box-shadow: 0 6px 20px rgba(0,0,0,.12);
    }
    #astuce b { display: block; font-size: 1.1em; margin-bottom: 4px; }
    #astuce .partage { white-space: nowrap; border-bottom: 2px solid rgba(60,60,66,.4); }
  </style>
</head>
<body>
  <canvas id="jeu" aria-label="Boule en métal sur une route avec looping"></canvas>
  <div id="consigne">Glisse ton doigt vers la droite pour lancer la boule&nbsp;!
    <small>Plus tu glisses vite, plus elle va vite. Doigt posé&nbsp;: elle roule vers ton doigt.</small></div>
  <button id="plein-ecran" class="rond" type="button" aria-label="Plein écran" title="Plein écran">
    <svg viewBox="0 0 24 24"><g class="entrer"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></g><g class="sortir"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></g></svg>
  </button>
  <button id="musique" class="rond" type="button" aria-label="Couper la musique">
    <svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/><path class="barre" d="M3 3l18 18"/></svg>
  </button>
  <button id="zoom" class="rond" type="button" aria-label="Voir tout le parcours">
    <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M7.5 10.5h6"/><path class="plus" d="M10.5 7.5v6"/></svg>
  </button>
  <button id="rejouer" class="rond" type="button" aria-label="Recommencer en haut de la butte" title="Recommencer (R)">
    <svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.2-5.1"/><path d="M6.5 3.5v4h4"/></svg>
  </button>
  <div id="astuce" hidden></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
